<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join Sort Arena — request to join</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='9' width='3' height='6' fill='%235b4bc9'/%3E%3Crect x='6.5' y='5' width='3' height='10' fill='%23a86ae0'/%3E%3Crect x='12' y='2' width='3' height='13' fill='%23e08a5a'/%3E%3C/svg%3E">
<!--
  Public, self-contained, ungated -- the one page on this origin a stranger with no prior
  standing can reach (see Caddyfile: /join.html and POST /api/join-requests both stay outside
  the @gated admin route). No dependency on index.html/admin.html's shared assets, same reasoning
  as CADS-webconference-demo's request-access.html: none of those would be reachable for the
  person this page is actually for either.

  The channel identity (holder + noise keypair) is generated entirely client-side via
  ct-agent-wasm (pkg/, wasm-bindgen output of ct-agent's own wasm/ crate -- "ct-agent for the
  browser", already proven in CADS-webconference-demo) and the join-request attestation is signed
  in-browser too -- no CLI install, nothing to copy-paste from a terminal. Only the resulting
  PUBLIC keys + a signature ever leave this page; the PRIVATE keys stay in localStorage and are
  shown once so the participant can save them for their own `ct-agent channel --serve` process
  later (docs/onboarding.md Step 4, unchanged -- that still runs on their own machine).
-->
<style>
 :root{
  --bg:#0c111d; --panel:#141b2c; --panel2:#1a2338; --sunken:#0e1524;
  --line:#2a3450; --line-soft:#212a41;
  --ink:#e8edf6; --muted:#8a93ad; --muted2:#c3c9db;
  --accent:#7f6df2; --accent-soft:#5b4bc9; --on-accent:#12102a;
  --ok:#4ec9b0; --danger:#e5654f;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,"Source Serif 4",Georgia,serif;
 }
 @media (prefers-color-scheme: light){
  :root{
   --bg:#f5f7fb; --panel:#ffffff; --panel2:#eef1f8; --sunken:#f0f3fa;
   --line:#d7deec; --line-soft:#e3e8f3;
   --ink:#131a2c; --muted:#5b6478; --muted2:#333d54;
   --accent:#5a46d6; --accent-soft:#4636ad; --on-accent:#ffffff;
   --ok:#2f8a7d; --danger:#c0412c;
  }
 }
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);line-height:1.6;
  -webkit-font-smoothing:antialiased}
 code,pre{font-family:var(--mono)}
 .shell{max-width:38rem;margin:0 auto;padding:2rem 1.5rem 4rem}
 h1{font-size:1.35rem;margin:0 0 .3rem}
 .lede{color:var(--muted2);margin:0 0 1.4rem}
 .lede a{color:var(--accent)}
 h2{font-size:.85rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);margin:1.6rem 0 .6rem}
 .step{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem}
 .step pre{background:var(--sunken);border:1px solid var(--line-soft);border-radius:7px;
  padding:.7rem .9rem;overflow-x:auto;font-size:.82rem;color:var(--muted2);white-space:pre-wrap;
  word-break:break-word;margin:.5rem 0 0}
 label{display:block;font-size:.78rem;font-family:var(--mono);color:var(--muted);margin:.9rem 0 .3rem}
 input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--ink);
  padding:.55rem .75rem;font:inherit;font-family:var(--mono);font-size:.85rem}
 input:focus{outline:none;border-color:var(--accent)}
 button{margin-top:1.2rem;font:inherit;background:var(--accent-soft);color:#fff;border:none;
  border-radius:8px;padding:.65rem 1.2rem;font-weight:600;cursor:pointer}
 button:disabled{opacity:.5;cursor:not-allowed}
 #note{margin-top:.8rem;font-size:.88rem}
 #note[data-kind="ok"]{color:var(--ok)}
 #note[data-kind="error"]{color:var(--danger)}
 #identity-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:1rem 1.1rem;margin-bottom:1.2rem}
 .identity-pub{margin-bottom:.7rem}
 .identity-pub code{display:block;margin-top:.3rem;background:var(--sunken);border:1px solid var(--line-soft);
  border-radius:7px;padding:.5rem .7rem;font-size:.8rem;word-break:break-all;color:var(--muted2)}
 .identity-warn{font-size:.82rem;color:var(--accent);margin-bottom:.6rem;line-height:1.5}
 .identity-priv{background:var(--sunken);border:1px solid var(--line-soft);border-radius:7px;
  padding:.7rem .9rem;font-size:.78rem;color:var(--muted2);white-space:pre-wrap;word-break:break-all;
  margin:0 0 .7rem}
 .identity-regen{margin-top:0;background:transparent;color:var(--muted);border:1px solid var(--line);
  font-weight:400;font-size:.78rem;padding:.4rem .8rem}
 .version-req{font-size:.8rem;color:var(--muted2);line-height:1.5;margin:0 0 .7rem}
 .version-req strong{color:var(--ink)}
 .version-req a{color:var(--accent)}
</style>
</head>
<body>
<div class="shell">
  <h1>Request to join Sort Arena</h1>
  <p class="lede">Your handler runs on your own machine, behind your own tunnel — never on this
    bridge. See <a href="https://scimbe.github.io/CADS-DEMO-sort-docs/how-to/join-as-a-participant/">the
    how-to</a> if you haven't written a handler yet; this page only requests the channel to reach
    it once you have.</p>

  <h2>Your channel identity</h2>
  <div id="identity-box">generating…</div>

  <h2>Submit</h2>
  <form id="join-form">
    <label for="you">Participant id</label>
    <input id="you" name="you" placeholder="your-id" pattern="[a-z0-9][a-z0-9\-]{0,63}" required>
    <label for="label">Display label</label>
    <input id="label" name="label" placeholder="Your strategy, in a few words">
    <button type="submit">Request to join</button>
  </form>
  <div id="note"></div>
</div>
<script type="module" src="./join.js"></script>
</body>
</html>
