<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sort Arena — operator waiting room</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='9' width='3' height='6' fill='%235b4bc9'/%3E%3Crect x='6.5' y='5' width='3' height='10' fill='%23a86ae0'/%3E%3Crect x='12' y='2' width='3' height='13' fill='%23e08a5a'/%3E%3C/svg%3E">
<!--
  Operator-only. Reached only via Caddy's gated route (see Caddyfile's @gated block) --
  X-Gate-Email must already be set by the login gate before this page or its API calls are
  reachable at all; the bridge independently re-checks SORT_ADMIN_EMAILS server-side on every
  admin route regardless (never trust the client alone), so this page assumes it's talking to
  an already-authenticated session and doesn't do its own login flow.

  Approve is fully automated: it mints both channel grants and registers the channel + both
  members with the control plane for real (see server.js's automateApproval) -- the participant
  is live the moment the API call returns, no manual command-pasting step. If the deployment
  isn't configured for automation (missing SORT_CHANNEL_*/SORT_CP_URL/SORT_OIDC_TOKEN env vars),
  Approve fails closed with a 503 rather than silently falling back to a manual flow.
-->
<style>
 :root{
  --bg:#0c111d; --panel:#141b2c; --panel2:#1a2338; --sunken:#0e1524;
  --line:#2a3450; --line-soft:#212a41;
  --ink:#e8edf6; --muted:#8a93ad; --muted2:#c3c9db;
  --accent:#7f6df2; --accent-soft:#5b4bc9; --on-accent:#12102a;
  --ok:#4ec9b0; --fault:#dfa63f; --danger:#e5654f;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
  --serif:Charter,"Bitstream Charter","Sitka Text",Cambria,"Source Serif 4",Georgia,serif;
 }
 @media (prefers-color-scheme: light){
  :root{
   --bg:#f5f7fb; --panel:#ffffff; --panel2:#eef1f8; --sunken:#f0f3fa;
   --line:#d7deec; --line-soft:#e3e8f3;
   --ink:#131a2c; --muted:#5b6478; --muted2:#333d54;
   --accent:#5a46d6; --accent-soft:#4636ad; --on-accent:#ffffff;
   --ok:#2f8a7d; --fault:#9a6a12; --danger:#c0412c;
  }
 }
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);line-height:1.6;
  -webkit-font-smoothing:antialiased}
 code,pre{font-family:var(--mono)}
 .shell{max-width:56rem;margin:0 auto;padding:2rem 1.5rem 4rem}
 h1{font-size:1.4rem;margin:0 0 .3rem}
 .lede{color:var(--muted2);margin:0 0 1.6rem;max-width:56ch}
 .lede a{color:var(--accent)}
 h2{font-size:1rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;
  color:var(--muted);margin:2rem 0 .8rem;border-bottom:1px solid var(--line);padding-bottom:.5rem}
 .empty{color:var(--muted);font-size:.92rem;font-style:italic}
 ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.7rem}
 li{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:.9rem 1.1rem}
 .row{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
 .who{font-weight:600}
 .who .id{font-family:var(--mono);font-size:.85em;color:var(--muted2);font-weight:400}
 .meta{font-size:.8rem;color:var(--muted)}
 .actions{display:flex;gap:.5rem}
 button{font:inherit;font-family:var(--mono);font-size:.8rem;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);color:var(--ink);padding:.45rem .9rem;cursor:pointer}
 button:hover{border-color:var(--accent)}
 button:disabled{opacity:.5;cursor:not-allowed}
 button.approve{background:var(--accent-soft);color:#fff;border-color:var(--accent-soft)}
 button.decline,button.revoke{color:var(--danger);border-color:var(--danger)}
 .note{font-size:.85rem;margin-top:.6rem}
 .note[data-kind="ok"]{color:var(--ok)}
 .note[data-kind="error"]{color:var(--danger)}
</style>
</head>
<body>
<div class="shell">
  <h1>Sort Arena — waiting room</h1>
  <p class="lede">See
    <a href="https://scimbe.github.io/CADS-DEMO-sort-docs/how-to/join-as-a-participant/">the
    how-to</a> for the full reference.</p>

  <h2>Pending (<span id="pending-count">0</span>)</h2>
  <p class="empty" id="pending-empty">Nobody waiting.</p>
  <ul id="pending-list"></ul>

  <h2>Live, self-service admitted (<span id="live-count">0</span>)</h2>
  <p class="empty" id="live-empty">Nobody admitted through the waiting room yet.</p>
  <ul id="live-list"></ul>
</div>
<script src="./admin.js"></script>
</body>
</html>
